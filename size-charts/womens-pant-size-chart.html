<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Women’s Pant Sizing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Women on Course — Pearl colourway */
  :root { --pearl:#F8F5F1; --navy:#1F2A44; --gold:#9E7A38; --line:rgba(158,122,56,.35); --tint:#F1EBE2; }
  @page { size: A4; margin: 0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--pearl); }
  .page { width:210mm; height:297mm; margin:0 auto; background:var(--pearl); color:var(--navy);
          font-family:'Montserrat',sans-serif; padding:20mm 18mm 19mm; display:flex; flex-direction:column; align-items:center; position:relative; }
  .page::before { content:""; position:absolute; inset:8mm; border:1px solid var(--line); pointer-events:none; }

  /* logo lockup */
  .logo { text-align:center; line-height:1; }
  .logo .small { font-size:8.5pt; letter-spacing:.42em; color:var(--gold); text-align:left; padding-left:2mm; }
  .logo .word { font-family:'Playfair Display',serif; font-weight:500; font-size:44pt; letter-spacing:.02em; color:var(--navy); }
  .logo .on { display:flex; align-items:center; gap:5mm; margin:1mm 0 2mm; }
  .logo .on::before,.logo .on::after { content:""; flex:1; height:1px; background:var(--gold); }
  .logo .on span { font-family:'Playfair Display',serif; font-style:italic; font-size:30pt; color:var(--gold); }
  .logo .since { font-size:8.5pt; letter-spacing:.42em; color:var(--gold); text-align:right; margin-top:2mm; }
  .logo .course { padding-left:12mm; }

  .rule { width:22mm; height:1px; background:var(--gold); margin:13mm 0 7mm; }
  h1 { font-weight:500; font-size:17pt; letter-spacing:.38em; padding-left:.38em; }
  .sub { margin-top:4mm; font-size:8.5pt; letter-spacing:.4em; color:var(--gold); }

  table { margin-top:12mm; width:100%; table-layout:fixed; border-collapse:collapse; text-align:center; }
  thead th { background:var(--navy); color:var(--pearl); font-weight:500; font-size:8.5pt; letter-spacing:.24em;
             padding:5mm 1mm; }
  thead th.region { color:#E4D3B0; }
  thead th.brand { font-size:7.5pt; letter-spacing:.14em; }
  thead tr.group th { background:transparent; color:var(--gold); font-size:7.5pt; letter-spacing:.38em; padding:0 0 3mm; font-weight:500; }
  thead tr.group th.span { border-bottom:1px solid var(--gold); }
  tbody td { font-family:'Playfair Display',serif; font-size:15pt; padding:4.6mm 1mm; font-variant-numeric:lining-nums tabular-nums; border-bottom:1px solid var(--line); }
  tbody tr:nth-child(even) td { background:var(--tint); }
  tbody td:first-child { font-weight:600; }
  td.brandsep, th.brandsep { border-left:1px solid var(--line); }
  td.empty { color:transparent; }

  .note { margin-top:8mm; font-size:8pt; letter-spacing:.06em; color:var(--navy); opacity:.75; font-style:normal; text-align:center; line-height:1.6; }
  .foot { margin-top:auto; padding-top:6mm; display:flex; flex-direction:column; align-items:center; gap:3mm; }
  .foot .r { width:12mm; height:1px; background:var(--gold); }
  .foot .t { font-size:7.5pt; letter-spacing:.4em; color:var(--gold); }
</style>
</head>
<body>
<div class="page">
  <div class="logo">
    <div class="small">GOLF FASHION</div>
    <div class="word">WOMEN</div>
    <div class="on"><span>on</span></div>
    <div class="word course">COURSE</div>
    <div class="since">SINCE 2004</div>
  </div>

  <div class="rule"></div>
  <h1>WOMEN’S PANT SIZING</h1>
  <div class="sub">SIZE CONVERSION GUIDE</div>

  <table>
    <thead>
      <tr class="group">
        <th colspan="4" class="span">INTERNATIONAL</th>
        <th style="width:4mm"></th>
        <th colspan="3" class="span">BY BRAND</th>
      </tr>
      <tr>
        <th class="region">AUST</th><th class="region">UK</th><th class="region">USA</th><th class="region">EURO</th>
        <th style="width:4mm;background:transparent"></th>
        <th class="brand">RÖHNISCH</th><th class="brand">J.LINDEBERG</th><th class="brand">NIVO</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <p class="note">Sizes are a guide only — fit varies by style.<br>Our team is happy to help you find your perfect fit.</p>

  <div class="foot"><div class="r"></div><div class="t">WOMEN ON COURSE · GOLF FASHION</div></div>
</div>
<script>
  // AUST, UK, USA, EURO, Röhnisch, J.Lindeberg, Nivo (Nivo left blank to fill in)
  const rows = [
    [4, 4, 0, 30, '', 26, ''],
    [6, 6, 2, 32, 34, 27, ''],
    [8, 8, 4, 34, 36, 28, ''],
    [10, 10, 6, 36, 38, 29, ''],
    [12, 12, 10, 38, 40, 30, ''],
    [14, 14, 12, 40, 42, 31, ''],
    [16, 16, 14, 42, 44, 32, ''],
  ];
  document.getElementById('rows').innerHTML = rows.map(r =>
    '<tr>' + r.slice(0,4).map(v => `<td>${v}</td>`).join('') + '<td></td>' +
    r.slice(4).map((v,i) => `<td class="${i===0?'brandsep ':''}${v===''?'empty':''}">${v===''?'–':v}</td>`).join('') + '</tr>'
  ).join('');
</script>
</body>
</html>
